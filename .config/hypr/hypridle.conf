general {
    # Never carry a modal keymap through the lock screen.  In particular, the
    # system submap contains single-key lock/reboot/exit actions.
    lock_cmd = hyprctl dispatch 'hl.dsp.submap("reset")'; hyprlock
    unlock_cmd = hyprctl dispatch 'hl.dsp.submap("reset")'
    on_lock_cmd = hyprctl dispatch 'hl.dsp.submap("reset")'
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.submap("reset")'

    # Route suspend locking through lock_cmd so every lock follows one path.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.submap("reset")'; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Lock the screen after 5 mins
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off screen after 7 mins
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend the system after 20 mins
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
